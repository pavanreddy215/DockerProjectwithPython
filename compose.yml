version: '3.8'
services: 
  db:
    image: pavanreddy215/library:db
    ports:
      - "3306:3306"
    deploy:
      replicas: 1
    networks:
      - mynetwork

  auth_service:
    image: pavanreddy215/library:auth
    ports:
      - "5001:5001"
    deploy:
      replicas: 1
    depends_on:
      - db
    networks:
      - mynetwork

  book_service:
    image: pavanreddy215/library:book
    ports:
      - "5002:5002"
    deploy:
      replicas: 1
    depends_on:
      - db
    networks:
      - mynetwork
  
  borrow_service:
    image: pavanreddy215/library:borrow
    ports:
      - "5003:5003"
    deploy:
      replicas: 1
    depends_on:
      - db
    networks:
      - mynetwork
  
  frontend:
    image: pavanreddy215/library:frontend
    ports:
      - "5000:5000"
    deploy:
      replicas: 1
    depends_on:
      - auth_service
      - book_service
      - borrow_service
    networks:
      - mynetwork

networks:
  mynetwork:
    driver: overlay
